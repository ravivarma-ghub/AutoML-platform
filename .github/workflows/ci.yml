# =============================================================================
# Intelligent AutoML Platform — CI Pipeline
# Triggers: every push and pull_request on any branch
# Jobs: test, lint, docker (build-only on non-main; build+push on main)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/automl-platform

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Run pytest with coverage report
  # ---------------------------------------------------------------------------
  test:
    name: "🧪 Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    # Spin up a throwaway PostgreSQL for integration tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: automl
          POSTGRES_PASSWORD: automl
          POSTGRES_DB: automl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://automl:automl@localhost:5432/automl_test
      MLFLOW_TRACKING_URI: ""
      SECRET_KEY: ci-test-secret-key
      DEBUG: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock httpx

      - name: Run Alembic migrations (test DB)
        run: |
          alembic upgrade head
        env:
          DATABASE_URL: postgresql://automl:automl@localhost:5432/automl_test

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v \
            --tb=short \
            -p no:warnings

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 2 — Ruff lint + format check
  # ---------------------------------------------------------------------------
  lint:
    name: "🔍 Lint & Format (ruff)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff — lint check
        run: ruff check . --output-format=github

      - name: Ruff — format check (no modification)
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Job 3 — Docker build (and push on main)
  # ---------------------------------------------------------------------------
  docker:
    name: "🐳 Docker Build${{ github.ref == 'refs/heads/main' && ' & Push' || '' }}"
    runs-on: ubuntu-latest
    needs: [test, lint]

    # Only push from main branch and only when secrets are present
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: "0"          # warn-only in CI; set to "1" to block on HIGH/CRITICAL
          ignore-unfixed: true
          severity: HIGH,CRITICAL
